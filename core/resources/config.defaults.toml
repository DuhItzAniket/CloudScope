# CloudScope configuration: built-in defaults.
#
# To change a setting, copy only the lines you need (and schema_version) into your own config.toml:
#   Windows:  %APPDATA%\CloudScope\config.toml
#   Linux:    ~/.config/cloudscope/config.toml
# Unknown keys and invalid values are reported as errors when CloudScope starts.
# `cloudscope-info --show-config` prints the configuration in effect and the files it came from.

schema_version = 1

[logging]
# Messages below this level are dropped: trace, debug, info, warn, error, critical.
level = "info"
# Write log lines to standard error.
console = true
# Write log lines to cloudscope.log in the log folder.
file = true
# Log folder. Empty: %LOCALAPPDATA%\CloudScope\logs on Windows, ~/.local/state/cloudscope/logs on Linux.
directory = ""
# A log file is rotated when it would grow beyond this size (MB).
max_file_mb = 10
# Number of log files kept: cloudscope.log plus cloudscope.1.log, cloudscope.2.log, ...
max_files = 5

[camera]
# Offer the computer's USB video cameras and built-in webcams (UVC) as devices.
uvc = true

[simulation]
# Offer simulated devices (sky camera, pan-tilt mount, IMU, GPS receiver, environment sensors) next to real
# ones. Everything they deliver is labelled as simulated.
enabled = true
# The same seed gives the same clouds and the same sensor noise.
seed = 1
# Folder of JPEG or PNG pictures that the replay camera shows in name order, again and again.
# Empty: no replay camera.
replay_folder = ""
# Pictures per second of the replay camera.
replay_fps = 2.0

[desktop]
# Theme of the desktop application: "dark", or "night" for the red night-vision theme.
theme = "dark"
# Live-view renderer: "auto" (OpenGL when the computer offers it, software otherwise), "opengl" or "raster".
renderer = "auto"
# Folder for sessions and the frame catalogue. Empty: the Pictures folder of the user, subfolder CloudScope.
session_root = ""
# Device id of the camera opened when the application starts (see cloudscope-info --devices). Empty: none.
default_camera = ""
# How times are shown: "utc", "local" or "both".
time_display = "both"
# Unit of temperature displays: "celsius" or "fahrenheit".
temperature_unit = "celsius"
# Intrinsic calibration file (schema cloudscope.camera_model/1, from cloudscope-camtool calibrate) that the sky
# overlays use. Empty: no sky overlays.
calibration_file = ""

[desktop.site]
# Where the camera stands: an id for file names, latitude (north positive), longitude (east positive) and
# altitude above sea level.
id = "site"
latitude_deg = 0.0
longitude_deg = 0.0
altitude_m = 0.0

[desktop.pointing]
# Where the camera looks, declared by the operator and used until a mount or an IMU reports it: azimuth from
# north through east, elevation above the horizon, roll about the optical axis.
azimuth_deg = 0.0
elevation_deg = 90.0
roll_deg = 0.0

[desktop.shortcuts]
# Keyboard shortcuts by action id, in Qt's spelling, for example:  "view.fit" = "Ctrl+F"
# The action ids are listed in Preferences > Shortcuts. Empty text removes a shortcut.
